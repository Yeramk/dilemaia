<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora Básica - Tradicional</title>
</head>
<body>
  <h2>Calculadora Básica (Sin IA)</h2>
  
  <input type="text" id="pantalla" readonly><br><br>
  
  <button onclick="agregar('1')">1</button>
  <button onclick="agregar('2')">2</button>
  <button onclick="agregar('3')">3</button>
  <button onclick="operacion('+')">+</button><br><br>

  <button onclick="agregar('4')">4</button>
  <button onclick="agregar('5')">5</button>
  <button onclick="agregar('6')">6</button>
  <button onclick="operacion('-')">-</button><br><br>

  <button onclick="agregar('7')">7</button>
  <button onclick="agregar('8')">8</button>
  <button onclick="agregar('9')">9</button>
  <button onclick="operacion('*')">*</button><br><br>

  <button onclick="borrar()">C</button>
  <button onclick="agregar('0')">0</button>
  <button onclick="calcular()">=</button>
  <button onclick="operacion('/')">/</button>

  <script>
    let num1 = '';
    let num2 = '';
    let op = '';

    function agregar(numero) {
      document.getElementById('pantalla').value += numero;
    }

    function operacion(operador) {
      num1 = document.getElementById('pantalla').value;
      op = operador;
      document.getElementById('pantalla').value = '';
    }

    function borrar() {
      document.getElementById('pantalla').value = '';
      num1 = '';
      num2 = '';
      op = '';
    }

    function calcular() {
      num2 = document.getElementById('pantalla').value;
      let resultado = 0;
      if (op === '+') resultado = parseFloat(num1) + parseFloat(num2);
      if (op === '-') resultado = parseFloat(num1) - parseFloat(num2);
      if (op === '*') resultado = parseFloat(num1) * parseFloat(num2);
      if (op === '/') resultado = parseFloat(num1) / parseFloat(num2);
      document.getElementById('pantalla').value = resultado;
    }
  </script>
</body>
</html>
