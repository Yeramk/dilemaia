<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Web Moderna - Generada con IA</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-sub: #64748b;
      --btn-bg: #f1f5f9;
      --btn-hover: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-text: #ffffff;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --btn-bg: #334155;
      --btn-hover: #475569;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-text: #ffffff;
      --border: #334155;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .calculator-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 700px;
      display: grid;
      grid-template-columns: 1fr 260px;
      overflow: hidden;
    }

    @media (max-width: 650px) {
      .calculator-container {
        grid-template-columns: 1fr;
      }
    }

    .main-calc {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .display {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: right;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 90px;
      justify-content: center;
    }

    .history-prev {
      font-size: 0.85rem;
      color: var(--text-sub);
      min-height: 18px;
    }

    .current-val {
      font-size: 2rem;
      font-weight: 700;
      word-break: break-all;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button.key {
      background-color: var(--btn-bg);
      color: var(--text);
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      height: 52px;
      cursor: pointer;
    }

    button.key:hover {
      background-color: var(--btn-hover);
    }

    button.key.op {
      color: var(--accent);
    }

    button.key.equal {
      background-color: var(--accent);
      color: var(--accent-text);
      grid-column: span 2;
    }

    button.key.equal:hover {
      background-color: var(--accent-hover);
    }

    .history-panel {
      border-left: 1px solid var(--border);
      background-color: var(--bg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .clear-history {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .history-list {
      list-style: none;
      overflow-y: auto;
      max-height: 320px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      background-color: var(--card-bg);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.85rem;
      cursor: pointer;
      text-align: right;
    }

    .history-item .expr {
      color: var(--text-sub);
      font-size: 0.75rem;
    }

    .history-item .res {
      font-weight: 700;
      color: var(--accent);
    }
  </style>
</head>
<body data-theme="light">

  <div class="calculator-container">
    <div class="main-calc">
      <div class="top-bar">
        <span class="title">Calculadora IA</span>
        <button class="theme-btn" onclick="toggleTheme()">Modo Claro/Oscuro</button>
      </div>
      <div class="display">
        <div class="history-prev" id="prev-op"></div>
        <div class="current-val" id="display">0</div>
      </div>
      <div class="keypad">
        <button class="key op" onclick="clearAll()">C</button>
        <button class="key op" onclick="deleteChar()">⌫</button>
        <button class="key op" onclick="appendOp('%')">%</button>
        <button class="key op" onclick="appendOp('/')">÷</button>

        <button class="key" onclick="appendNum('7')">7</button>
        <button class="key" onclick="appendNum('8')">8</button>
        <button class="key" onclick="appendNum('9')">9</button>
        <button class="key op" onclick="appendOp('*')">×</button>

        <button class="key" onclick="appendNum('4')">4</button>
        <button class="key" onclick="appendNum('5')">5</button>
        <button class="key" onclick="appendNum('6')">6</button>
        <button class="key op" onclick="appendOp('-')">-</button>

        <button class="key" onclick="appendNum('1')">1</button>
        <button class="key" onclick="appendNum('2')">2</button>
        <button class="key" onclick="appendNum('3')">3</button>
        <button class="key op" onclick="appendOp('+')">+</button>

        <button class="key" onclick="appendNum('0')">0</button>
        <button class="key" onclick="appendNum('.')">.</button>
        <button class="key equal" onclick="calculate()">=</button>
      </div>
    </div>

    <div class="history-panel">
      <div class="history-header">
        <span>Historial</span>
        <button class="clear-history" onclick="clearHistory()">Limpiar</button>
      </div>
      <ul class="history-list" id="history-list"></ul>
    </div>
  </div>

  <script>
    let displayVal = '0';
    let prevOpVal = '';
    let shouldReset = false;

    const displayEl = document.getElementById('display');
    const prevOpEl = document.getElementById('prev-op');
    const historyListEl = document.getElementById('history-list');

    function updateDisplay() {
      displayEl.textContent = displayVal;
      prevOpEl.textContent = prevOpVal;
    }

    function appendNum(num) {
      if (displayVal === '0' || shouldReset) {
        displayVal = num;
        shouldReset = false;
      } else {
        if (num === '.' && displayVal.includes('.')) return;
        displayVal += num;
      }
      updateDisplay();
    }

    function appendOp(op) {
      if (shouldReset) shouldReset = false;
      const lastChar = displayVal.slice(-1);
      if (['+', '-', '*', '/', '%'].includes(lastChar)) {
        displayVal = displayVal.slice(0, -1) + op;
      } else {
        displayVal += op;
      }
      updateDisplay();
    }

    function clearAll() {
      displayVal = '0';
      prevOpVal = '';
      shouldReset = false;
      updateDisplay();
    }

    function deleteChar() {
      if (displayVal.length === 1 || shouldReset) {
        displayVal = '0';
        shouldReset = false;
      } else {
        displayVal = displayVal.slice(0, -1);
      }
      updateDisplay();
    }

    function calculate() {
      try {
        let expression = displayVal.replace(/%/g, '/100');
        let result = eval(expression);
        if (!isFinite(result)) throw new Error();
        result = Math.round(result * 1000000) / 1000000;
        
        addHistoryItem(displayVal, result);
        prevOpVal = displayVal + ' =';
        displayVal = String(result);
        shouldReset = true;
      } catch (e) {
        displayVal = 'Error';
        shouldReset = true;
      }
      updateDisplay();
    }

    function addHistoryItem(expr, res) {
      const li = document.createElement('li');
      li.className = 'history-item';
      li.innerHTML = `<div class="expr">${expr}</div><div class="res">= ${res}</div>`;
      li.onclick = () => {
        displayVal = String(res);
        shouldReset = false;
        updateDisplay();
      };
      historyListEl.prepend(li);
    }

    function clearHistory() {
      historyListEl.innerHTML = '';
    }

    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', newTheme);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendNum(e.key);
      if (e.key === '.') appendNum('.');
      if (['+', '-', '*', '/', '%'].includes(e.key)) appendOp(e.key);
      if (e.key === 'Enter' || e.key === '=') calculate();
      if (e.key === 'Backspace') deleteChar();
      if (e.key === 'Escape') clearAll();
    });
  </script>
</body>
</html>
